<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Box Picker</title>
<style>
  :root{
    --bg:#fbf6f2; --card:#ffffff; --ink:#2b2430; --muted:#a79aa3;
    --accent:#e58fa8; --accent-2:#f6c9d5; --ok:#36c28a; --line:#efe4e6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center}

  .stage{position:relative;width:1080px;height:1920px;flex:none;overflow:hidden;
    transform-origin:center center;
    background:
      radial-gradient(900px 700px at 15% 8%, #fde7ee 0%, transparent 60%),
      radial-gradient(800px 800px at 95% 55%, #fff1e2 0%, transparent 60%),
      radial-gradient(900px 600px at 30% 100%, #f1ecfb 0%, transparent 60%),
      var(--bg);}

  /* ---------- carousel ---------- */
  .card{position:absolute;left:0;top:0;width:580px;height:660px;border-radius:48px;
    background:var(--card);display:flex;align-items:center;justify-content:center;
    box-shadow:0 30px 70px rgba(120,80,100,.14),0 4px 14px rgba(120,80,100,.06);
    will-change:transform,opacity;transition:box-shadow .4s ease, outline-color .4s ease;
    outline:6px solid transparent;outline-offset:-6px}
  .card img{width:84%;height:84%;object-fit:contain;
    filter:drop-shadow(0 18px 22px rgba(60,30,40,.18));pointer-events:none;user-select:none}
  .card.selected{outline-color:var(--accent);
    box-shadow:0 40px 90px rgba(229,143,168,.35),0 0 0 14px rgba(229,143,168,.14)}
  .card.tap{animation:tap .32s ease}
  @keyframes tap{50%{scale:.95}}

  /* ---------- form ---------- */
  .field{position:absolute;left:150px;width:780px;height:132px;border-radius:34px;
    background:#fff;border:3px solid var(--line);display:flex;align-items:center;padding:0 46px;
    box-shadow:0 14px 34px rgba(120,80,100,.08);
    opacity:0;transform:translateY(60px);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.9,.25,1.2),border-color .25s}
  .field.show{opacity:1;transform:none}
  .field.focus{border-color:var(--accent);box-shadow:0 0 0 10px rgba(229,143,168,.15),0 14px 34px rgba(120,80,100,.08)}
  .field.tap{animation:ftap .28s ease}
  @keyframes ftap{50%{scale:.98}}
  #fName{top:1240px} #fEmail{top:1406px}
  .ph{position:absolute;left:46px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:44px;
    transition:all .25s ease;pointer-events:none}
  .field.filled .ph,.field.focus .ph{top:28px;font-size:24px;transform:none;color:var(--accent);font-weight:600}
  .val{font-size:46px;color:var(--ink);font-weight:500;white-space:nowrap;margin-top:24px}
  .caret{display:inline-block;width:4px;height:50px;background:var(--accent);margin-left:4px;margin-top:24px;opacity:0;border-radius:2px}
  .field.focus .caret{animation:blink 1s steps(1) infinite}
  @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}

  .btn{position:absolute;left:150px;top:1602px;width:780px;height:140px;border:none;border-radius:70px;
    background:linear-gradient(135deg,#f2a3b9 0%,#e3829e 100%);color:#fff;font-size:52px;font-weight:700;
    letter-spacing:1px;font-family:inherit;box-shadow:0 22px 44px rgba(227,130,158,.4);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    opacity:0;transform:translateY(60px) scale(.9);
    transition:opacity .45s ease,transform .6s cubic-bezier(.2,.9,.25,1.25),width .5s cubic-bezier(.6,0,.3,1),left .5s cubic-bezier(.6,0,.3,1),background .4s,box-shadow .4s}
  .btn.show{opacity:1;transform:none}
  .btn.pressed{transform:scale(.95)}
  .btn .lbl{transition:opacity .2s}
  .btn.done{width:140px;left:470px;background:var(--ok);box-shadow:0 22px 50px rgba(54,194,138,.45)}
  .btn.done .lbl{opacity:0}
  .btn svg{position:absolute;width:76px;height:76px}
  .btn svg path{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:110;stroke-dashoffset:110}
  .btn.done svg path{transition:stroke-dashoffset .45s ease .45s;stroke-dashoffset:0}
  .btn.done.pop{animation:pop .5s ease .4s}
  @keyframes pop{50%{scale:1.18}}

  /* ---------- hand ---------- */
  .hand{position:absolute;left:0;top:0;width:400px;z-index:20;pointer-events:none;
    -webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 98%);
            mask-image:linear-gradient(to bottom,#000 72%,transparent 98%);
    filter:drop-shadow(0 18px 24px rgba(60,30,40,.22));
    transform-origin:15% 0%;transition:transform 1s cubic-bezier(.3,.75,.25,1)}
  .hand.press{animation:hpress .26s ease}
  @keyframes hpress{50%{scale:.9}}
  .ripple{position:absolute;z-index:19;width:40px;height:40px;border-radius:50%;
    background:rgba(229,143,168,.45);transform:translate(-50%,-50%) scale(.3);pointer-events:none;
    animation:rip .6s ease-out forwards}
  @keyframes rip{to{transform:translate(-50%,-50%) scale(5);opacity:0}}

  canvas{position:absolute;inset:0;z-index:30;pointer-events:none}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div id="cards"></div>

  <div class="field" id="fName"><span class="ph">Name</span><span class="val"></span><span class="caret"></span></div>
  <div class="field" id="fEmail"><span class="ph">Email</span><span class="val"></span><span class="caret"></span></div>
  <button class="btn" id="btn"><span class="lbl">Add</span>

const stage = document.getElementById('stage');
const cardsEl = document.getElementById('cards');
const hand = document.getElementById('hand');
const fName = document.getElementById('fName');
const fEmail = document.getElementById('fEmail');
const btn = document.getElementById('btn');
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---- fit stage to viewport ---- */
function fit(){
  const s = Math.min(innerWidth/1080, innerHeight/1920);
  stage.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ---- carousel (continuous position, infinite wrap) ---- */
const N = IMGS.length, CW = 580, CH = 660, CX = 540, CY = 780, GAP = 470;
const cards = IMGS.map(src => {
  const d = document.createElement('div'); d.className = 'card';
  d.innerHTML = `<img alt="" src="${src}">`; cardsEl.appendChild(d); return d;
});
let pos = 0, focusMode = 0;   // focusMode 0..1 fades side cards after selection
function wrap(o){ o = ((o % N) + N) % N; return o > N/2 ? o - N : o; }
function render(){
  cards.forEach((c,i) => {
    const o = wrap(i - pos), a = Math.abs(o);
    const x = CX + o*GAP - CW/2, y = CY - CH/2 + Math.min(a,2)*40;
    let sc = 1 - Math.min(a,2)*0.2;
    let op = a > 2.2 ? 0 : 1 - Math.max(0,a-1.2)*1;
    if (a > 0.5) { op *= 1 - focusMode*0.8; sc *= 1 - focusMode*0.06; }
    else sc *= 1 + focusMode*0.04;
    c.style.transform = `translate(${x}px,${y}px) scale(${sc}) rotateY(${o*-8}deg)`;
    c.style.opacity = Math.max(0, op);
    c.style.zIndex = 10 - Math.round(a*2);
  });
}
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
function tween(set, from, to, ms, e = ease){
  return new Promise(res => {
    const t0 = performance.now();
    (function step(now){
      const t = Math.min(1, (now - t0)/ms); set(from + (to-from)*e(t)); render();
      t < 1 ? requestAnimationFrame(step) : res();
    })(t0);
  });
}
const goTo = (p, ms) => tween(v => pos = v, pos, p, ms);
render();

/* ---- hand ---- */
const TIP = { x: 61, y: 4 };        // fingertip inside the 400px-wide hand image
const OFF = { x: 1180, y: 2100 };   // parked off-stage, bottom-right
function moveHand(p, ms = 1000){
  hand.style.transitionDuration = ms + 'ms';
  hand.style.transform = `translate(${p.x - TIP.x}px, ${p.y - TIP.y}px) rotate(-6deg)`;
  return sleep(ms + 60);
}
function parkHand(){
  hand.style.transition = 'none';
  hand.style.transform = `translate(${OFF.x}px, ${OFF.y}px) rotate(-6deg)`;
  void hand.offsetWidth; hand.style.transition = '';
}
function ripple(p){
  const r = document.createElement('div'); r.className = 'ripple';
  r.style.left = p.x + 'px'; r.style.top = p.y + 'px'; stage.appendChild(r);
  setTimeout(() => r.remove(), 650);
}
async function tap(p, el){
  hand.classList.remove('press'); void hand.offsetWidth; hand.classList.add('press');
  await sleep(120); ripple(p);
  if (el){ el.classList.remove('tap'); void el.offsetWidth; el.classList.add('tap'); }
  await sleep(220);
}

/* ---- typing ---- */
async function type(field, text){
  const v = field.querySelector('.val');
  for (const ch of text){ v.textContent += ch; await sleep(85 + Math.random()*70); }
  field.classList.add('filled');
}

/* ---- confetti ---- */
const cv = document.getElementById('fx'), cx = cv.getContext('2d');
let parts = [], raf = 0;
const COLORS = ['#f2a3b9','#e3829e','#ffd27a','#f7b267','#9fd8c4','#36c28a','#b9a7f0','#8fc7ff'];
function confetti(ox, oy){
  for (let i=0;i<220;i++){
    const ang = -Math.PI/2 + (Math.random()-.5)*Math.PI*1.4, sp = 18 + Math.random()*30;
    parts.push({x:ox,y:oy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
      w:14+Math.random()*16,h:8+Math.random()*10,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,
      c:COLORS[i%COLORS.length],round:Math.random()<.3,life:0});
  }
  for (let i=0;i<120;i++){   // gentle rain from top
    parts.push({x:Math.random()*1080,y:-40-Math.random()*400,vx:(Math.random()-.5)*4,vy:4+Math.random()*6,
      w:14+Math.random()*14,h:8+Math.random()*8,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,
      c:COLORS[i%COLORS.length],round:Math.random()<.3,life:0});
  }
  if (!raf) raf = requestAnimationFrame(drawFx);
}
function drawFx(){
  cx.clearRect(0,0,1080,1920);
  parts.forEach(p => {
    p.vx *= .985; p.vy = p.vy*.985 + .7; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    cx.globalAlpha = Math.max(0, Math.min(1, (260 - p.life)/60));
    if (p.round){ cx.beginPath(); cx.arc(0,0,p.h*.7,0,6.28); cx.fill(); }
    else { cx.scale(1, Math.cos(p.life*.15 + p.r)); cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); }
    cx.restore();
  });
  parts = parts.filter(p => p.y < 2000 && p.life < 260);
  raf = parts.length ? requestAnimationFrame(drawFx) : (cx.clearRect(0,0,1080,1920), 0);
}

/* ---- targets (stage coords) ---- */
const P = {
  card:  { x: 560, y: 800 },
  name:  { x: 540, y: 1306 },
  email: { x: 540, y: 1472 },
  btn:   { x: 540, y: 1672 },
  rest:  { x: 860, y: 1820 }
};

function reset(){
  [fName,fEmail].forEach(f => { f.className = 'field'; f.querySelector('.val').textContent = ''; });
  btn.className = 'btn';
  cards.forEach(c => c.className = 'card');
  focusMode = 0; render(); parkHand();
}

let last = -1;
async function run(){
  reset();
  await sleep(500);
  // spin right → left
  for (let i=0;i<3;i++){ await goTo(Math.round(pos)+1, 650); await sleep(260); }
  // spin left → right
  for (let i=0;i<2;i++){ await goTo(Math.round(pos)-1, 650); await sleep(260); }
  // land on a random box
  let t; do { t = Math.floor(Math.random()*N); } while (t === last); last = t;
  let d = wrap(t - pos); if (d === 0) d = N; if (Math.abs(d) > 2) d = d > 0 ? d - N : d + N;
  if (d === 0) d = 1;
  await goTo(pos + d, 900 + Math.abs(d)*150);
  pos = ((Math.round(pos) % N) + N) % N; render();
  const sel = cards[pos];

  // hand picks the box
  await moveHand(P.card, 1050);
  await tap(P.card, sel);
  sel.classList.add('selected');
  tween(v => focusMode = v, 0, 1, 600);
  await sleep(250);

  // fields appear
  fName.classList.add('show'); await sleep(140); fEmail.classList.add('show');
  await sleep(500);

  await moveHand(P.name, 800);
  await tap(P.name, fName); fName.classList.add('focus');
  await sleep(150); await type(fName, 'Lisa'); await sleep(300);
  fName.classList.remove('focus');

  await moveHand(P.email, 650);
  await tap(P.email, fEmail); fEmail.classList.add('focus');
  await sleep(150); await type(fEmail, 'mymail@m.com'); await sleep(300);
  fEmail.classList.remove('focus');

  // Add button
  btn.classList.add('show'); await sleep(450);
  await moveHand(P.btn, 700);
  btn.classList.add('pressed'); await tap(P.btn); btn.classList.remove('pressed');
  btn.classList.add('done','pop');
  await sleep(380);
  confetti(540, 1672);
  moveHand(P.rest, 900);
  await sleep(1300);
  hand.style.transitionDuration = '800ms';
  hand.style.transform = `translate(${OFF.x}px, ${OFF.y}px) rotate(-6deg)`;
  await sleep(2400);

  run();
}
run();
</script>
